<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS Theme Switcher</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { transition: background-color 0.4s ease, color 0.4s ease; }
  body.light { background-color: #f8f9fa; color: #000; }
  body.dark { background-color: #212529; color: #fff; }
</style>
</head>
<body class="light">
<div class="container py-5">
  <h1>Online Learning Platform</h1>
  <div class="dropdown my-4">
    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"> Switch Theme  </button>
    <ul class="dropdown-menu">
      <li><button class="dropdown-item" data-theme="light">Light Mode</button></li>
      <li><button class="dropdown-item" data-theme="dark">Dark Mode</button></li>
    </ul>
  </div>
  <p class="lead">This text changes color based on the selected theme.</p>
  <button class="btn btn-success">Example Button</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const themeButtons = document.querySelectorAll("[data-theme]");
  const body = document.body;
  function switchTheme(theme) {
    body.className = theme;
    localStorage.setItem("lms-theme", theme);
  }
  themeButtons.forEach(btn => {
    btn.addEventListener("click", () => switchTheme(btn.dataset.theme));
  });
  const savedTheme = localStorage.getItem("lms-theme");
  if (savedTheme) switchTheme(savedTheme);
</script>
</body>
</html>
